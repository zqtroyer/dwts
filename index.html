<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DWTS Fantasy League</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0d0015; --surface: #1a0030; --surface2: #240040;
    --border:  #4a0080; --accent:  #e040fb; --accent2:  #aa00ff;
    --accent3: #ff4081; --text:    #f0e6ff; --muted:    #9e7ab5;
    --success: #69f0ae; --warn:    #ffeb3b; --danger:   #ff5252;
    --gold:    #ffd700; --radius:  12px;
  }
  html { font-size: 16px; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; line-height: 1.4; }
  .hidden { display: none !important; }
  .muted  { color: var(--muted); }  .accent { color: var(--accent); }
  .success{ color: var(--success); } .danger { color: var(--danger); }
  .warn   { color: var(--warn); }   .gold   { color: var(--gold); }
  .bold   { font-weight: 700; }     .small  { font-size: 0.83em; }
  .text-center { text-align: center; }
  ::-webkit-scrollbar { width: 0; }

  /* Layout */
  #app { height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  #header {
    background: linear-gradient(135deg, #1a0030 0%, #2d0057 100%);
    border-bottom: 2px solid var(--accent2);
    padding: 16px 18px; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
  }
  #header .logo { font-size: 1.5em; font-weight: 900; letter-spacing: 2px; color: var(--accent); }
  #header .user-info { font-size: 0.85em; color: var(--muted); text-align: right; line-height: 1.3; }
  #header .user-info strong { color: var(--text); font-size: 1.05em; }
  #btn-logout {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 0.82em;
    margin-left: 10px; touch-action: manipulation; min-height: 46px;
    -webkit-tap-highlight-color: transparent;
  }
  #btn-logout:active { border-color: var(--accent3); color: var(--accent3); }

  /* Bottom Nav */
  #nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 2px solid var(--border);
    display: flex; align-items: stretch;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 200;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 5px; padding: 10px 4px; border: none;
    background: none; color: var(--muted); cursor: pointer;
    font-size: 0.72em; font-weight: 700; letter-spacing: 0.02em;
    border-radius: 0; touch-action: manipulation; min-height: 70px;
    -webkit-tap-highlight-color: transparent; white-space: nowrap;
  }
  .nav-btn .ni { display: flex; align-items: center; justify-content: center; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn:active { background: var(--surface2); }

  /* Main */
  #main { flex: 1; overflow-y: auto; padding: 20px 18px 130px; -webkit-overflow-scrolling: touch; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; }
  .card-title { font-size: 1.25em; font-weight: 700; color: var(--accent); margin-bottom: 18px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 16px 26px; border-radius: 14px; border: none; cursor: pointer;
    font-size: 1.05em; font-weight: 700; gap: 8px;
    touch-action: manipulation; min-height: 60px; -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary  { background: var(--accent2); color: #fff; }
  .btn-primary:active:not(:disabled) { background: #bf00ff; }
  .btn-danger   { background: var(--danger); color: #fff; }
  .btn-success  { background: #00897b; color: #fff; }
  .btn-success:active:not(:disabled) { background: #00796b; }
  .btn-outline  { background: none; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:active:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-sm       { padding: 12px 20px; font-size: 0.9em; border-radius: 12px; min-height: 52px; }
  .btn-accent3  { background: var(--accent3); color: #fff; }
  .btn-accent3:active:not(:disabled) { background: #f50057; }
  .btn-full     { width: 100%; }
  .inline-btns  { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Inputs */
  .input {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 16px 18px; border-radius: 14px; font-size: 17px; width: 100%;
    outline: none; -webkit-appearance: none; min-height: 58px;
  }
  .input:focus { border-color: var(--accent); }
  select.input { font-size: 17px; }
  select.input option { background: var(--surface2); }
  select.input option:disabled { color: var(--muted); font-style: italic; }
  label { font-size: 0.92em; color: var(--muted); margin-bottom: 8px; display: block; font-weight: 600; }

  /* Toast */
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--accent);
    color: var(--text); padding: 16px 32px; border-radius: 32px;
    font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; max-width: 88vw; text-align: center; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: var(--danger); background: #2a0015; }
  #toast.success-toast { border-color: var(--success); }

  /* Spinner */
  .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 8888; gap: 14px; flex-direction: column; }
  #loading-overlay span { color: var(--muted); font-size: 0.95em; }

  /* Login */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; background: var(--bg);
  }
  #login-box { width: 100%; max-width: 380px; }
  .player-list { display: flex; flex-direction: column; gap: .5rem; }
  .player-btn {
    width: 100%; padding: .85rem 1rem; background: var(--surface2);
    border: 2px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 1rem; font-weight: 600;
    cursor: pointer; text-align: center; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .player-btn:active { border-color: var(--accent); background: rgba(170,0,255,0.15); }

  /* Tables */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; font-weight: 800; font-size: 0.9em; flex-shrink: 0; }
  .rank-1 { background: var(--gold); color: #000; }
  .rank-2 { background: #c0c0c0; color: #000; }
  .rank-3 { background: #cd7f32; color: #fff; }
  .rank-n { background: var(--surface2); color: var(--muted); }

  /* Standings rows */
  .standings-row { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
  .standings-row-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: var(--surface2); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  .standings-row-header:active { background: #280050; }
  .standings-name { flex: 1; font-weight: 700; font-size: 1.05em; }
  .standings-pts { flex-shrink: 0; font-size: 1.2em; font-weight: 800; color: var(--accent); }
  .standings-arrow { color: var(--muted); font-size: 0.9em; transition: transform 0.2s; flex-shrink: 0; }
  .standings-detail { padding: 18px 20px; border-top: 1px solid var(--border); display: none; }
  .standings-detail.open { display: block; }
  .breakdown-section { margin-bottom: 16px; }
  .breakdown-section:last-child { margin-bottom: 0; }
  .breakdown-header { font-size: 0.78em; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .elim-couple { text-decoration: line-through; opacity: 0.45; }

  /* Score cards */
  .score-card { display: flex; justify-content: space-between; align-items: center; gap: 14px; background: var(--surface2); border-radius: 14px; padding: 18px 20px; margin-bottom: 10px; }
  .score-card-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
  .score-card-name { font-weight: 700; font-size: 1.1em; }
  .score-card-breakdown { font-size: 0.8em; color: var(--muted); margin-top: 4px; }
  .score-card-pts { font-size: 1.4em; font-weight: 800; color: var(--accent); flex-shrink: 0; }

  /* Picks */
  .pick-row { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }

  /* Status grid */
  .status-grid { display: flex; flex-direction: column; gap: 10px; }
  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .status-name { flex: 1; font-size: 1em; font-weight: 600; }
  .status-badge { padding: 8px 18px; border-radius: 22px; font-size: 0.88em; font-weight: 700; }
  .badge-submitted { background: rgba(105,240,174,0.15); color: var(--success); border: 1px solid var(--success); }
  .badge-pending   { background: rgba(255,235,59,0.1);   color: var(--warn);    border: 1px solid var(--warn); }

  /* History */
  .week-history-row { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .week-history-row .wh-top { display: flex; justify-content: space-between; align-items: center; }
  .week-history-row .wh-pts { font-size: 1.5em; font-weight: 800; color: var(--accent); }
  .week-history-detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .week-history-detail.open { display: block; }
  .brkdwn-row { display: flex; justify-content: space-between; font-size: 0.95em; padding: 7px 0; }
  .brkdwn-key { color: var(--muted); }
  .brkdwn-val.pos { color: var(--success); font-weight: 700; }

  /* Roster pills */
  .roster-pill { display: inline-block; background: rgba(224,64,251,0.12); border: 1px solid var(--accent2); color: var(--text); padding: 9px 18px; border-radius: 22px; font-size: 0.92em; margin: 4px; }
  .roster-pill.eliminated { opacity: 0.4; text-decoration: line-through; color: var(--muted); border-color: var(--border); background: none; }

  /* Reveals table */
  .reveals-table { width: 100%; border-collapse: collapse; }
  .reveals-table th { background: var(--surface2); padding: 10px 12px; font-size: 0.82em; color: var(--muted); text-align: left; font-weight: 700; }
  .reveals-table td { padding: 11px 12px; border-bottom: 1px solid rgba(74,0,128,0.3); font-size: 0.9em; }
  .reveals-table tr:last-child td { border-bottom: none; }
  .correct   { color: var(--success); }
  .incorrect { color: var(--danger); }
  .lb-1 { color: var(--gold); font-weight: 700; }

  /* Deadline banner */
  #deadline-banner {
    background: linear-gradient(90deg, rgba(170,0,255,0.15), rgba(255,64,129,0.15));
    border: 1px solid var(--accent2); border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .deadline-label { font-size: 0.8em; color: var(--muted); margin-bottom: 2px; }
  .deadline-time  { font-weight: 700; color: var(--accent); font-size: 0.95em; }
  .deadline-countdown { font-size: 1em; font-weight: 700; }
  .deadline-locked { color: var(--danger); }
  .deadline-open   { color: var(--success); }

  /* Admin */
  .admin-section { margin-bottom: 22px; }
  .admin-section h3 { font-size: 0.95em; font-weight: 700; color: var(--accent); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .form-row { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }

  /* Pick accordion */
  .pick-accordion { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .pick-acc-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 18px 20px; background: var(--surface2); cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pick-acc-header:active { background: #280050; }
  .acc-arrow { color: var(--muted); font-size: 0.9em; transition: transform 0.2s; display: inline-block; }
  .pick-acc-header.open .acc-arrow { transform: rotate(180deg); }
  .pick-acc-body { display: none; padding: 18px 20px; border-top: 1px solid var(--border); }
  .pick-acc-body.open { display: block; }
  .pick-status-txt { font-size: 0.85em; color: var(--muted); }

  /* Chips */
  .chip-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .chip {
    padding: 13px 20px; border-radius: 26px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); cursor: pointer;
    font-size: 0.95em; font-weight: 600; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .chip:active { opacity: 0.7; }
  .chip.elim-on { background: rgba(255,82,82,0.2); border-color: var(--danger); color: var(--danger); }

  /* Couple scores */
  .score-grid { display: flex; flex-direction: column; gap: 8px; }
  .score-row  { display: flex; align-items: center; gap: 10px; }
  .score-name { flex: 1; font-size: 0.88em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score-inp  { width: 80px; text-align: center; padding: 10px 10px; flex-shrink: 0; font-size: 16px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div id="login-box">

    <!-- Branding -->
    <div style="text-align:center;margin-bottom:2rem">
      <div style="font-size:2.4rem;font-weight:900;color:var(--accent);letter-spacing:2px;line-height:1">DWTS</div>
      <div style="font-size:1rem;font-weight:600;color:var(--text);margin-top:.4rem;letter-spacing:.5px">Fantasy League</div>
      <div style="font-size:.8rem;color:var(--muted);margin-top:.2rem">Dancing With The Stars</div>
    </div>

    <!-- Step 1: pick your name -->
    <div id="name-section">
      <div style="font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem;text-align:center">Who are you?</div>
      <div class="player-list" id="player-grid"></div>
    </div>

    <!-- Step 2: enter PIN -->
    <div id="pin-section" class="hidden">
      <button onclick="backToNames()" style="background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;padding:0;margin-bottom:1rem">← Back</button>
      <div style="text-align:center;margin-bottom:1.25rem">
        <div style="font-size:1rem;font-weight:700;color:var(--text)">Hi <span id="selected-name-label"></span>!</div>
        <div style="font-size:.8rem;color:var(--muted);margin-top:.25rem">Enter your 4-digit PIN</div>
      </div>
      <input type="tel" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4"
        placeholder="• • • •" autocomplete="off"
        style="width:100%;background:var(--surface2);border:2px solid var(--border);border-radius:10px;
               color:var(--text);font-size:1.5rem;text-align:center;padding:.75rem;letter-spacing:.5rem;
               outline:none;-webkit-appearance:none"
        onkeyup="if(event.key==='Enter')attemptLogin()">
      <button class="btn btn-primary btn-full" style="margin-top:.75rem;background:var(--accent2)" onclick="attemptLogin()">Enter</button>
      <div id="pin-error" class="hidden" style="color:var(--danger);font-size:.8rem;text-align:center;margin-top:.5rem">Wrong PIN — try again</div>
    </div>

  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div id="header">
    <div class="logo">DWTS</div>
    <div style="display:flex; align-items:center; gap:4px;">
      <div class="user-info"><strong id="hdr-name">—</strong><br><span id="hdr-role"></span></div>
      <button id="btn-logout" onclick="logout()">Out</button>
    </div>
  </div>
  <div id="main">
    <div id="view-picks" class="view">
      <div id="deadline-banner" class="hidden">
        <div>
          <div class="deadline-label">Episode deadline</div>
          <div class="deadline-time" id="deadline-time-str">—</div>
        </div>
        <div class="deadline-countdown" id="deadline-countdown">—</div>
      </div>
      <div id="picks-content"></div>
    </div>
    <div id="view-standings" class="view hidden">
      <div class="card">
        <div class="card-title">Season Standings</div>
        <div id="standings-content"><div class="muted small">Loading…</div></div>
      </div>
    </div>
    <div id="view-history" class="view hidden">
      <div class="card">
        <div class="card-title">Week History</div>
        <div id="history-content"><div class="muted small">Loading…</div></div>
      </div>
    </div>
    <div id="view-roster" class="view hidden">
      <div class="card">
        <div class="card-title">My Roster</div>
        <div id="roster-content"></div>
      </div>
      <div class="card">
        <div class="card-title">All Rosters</div>
        <div id="all-rosters-content"></div>
      </div>
    </div>
    <div id="view-admin" class="view hidden">
      <div id="admin-content"></div>
    </div>
  </div>
  <!-- Bottom nav -->
  <div id="nav">
    <button class="nav-btn active" data-view="picks" onclick="showView('picks')">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="11"/>
        </svg>
      </span>Picks
    </button>
    <button class="nav-btn" data-view="standings" onclick="showView('standings')">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="10" width="4" height="11"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="13" width="4" height="8"/>
        </svg>
      </span>Stands
    </button>
    <button class="nav-btn" data-view="history" onclick="showView('history')">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/>
        </svg>
      </span>History
    </button>
    <button class="nav-btn" data-view="roster" onclick="showView('roster')">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/>
        </svg>
      </span>Roster
    </button>
    <button class="nav-btn hidden" id="nav-admin" data-view="admin" onclick="showView('admin')">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93l-1.41 1.41M5.34 18.66l-1.41 1.41M4.93 4.93l1.41 1.41M18.66 18.66l1.41 1.41M2 12h2M20 12h2M12 2v2M12 20v2"/>
        </svg>
      </span>Admin
    </button>
  </div>
</div>

<div id="loading-overlay" class="hidden">
  <div class="spinner"></div>
  <span id="loading-msg">Loading…</span>
</div>
<div id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz6n_rTvz5o5_qgHTlKBuDowmbLVgMgMC3kxpryoJgSbl5pkjBsa35a_GRDqKNDawI/exec';

const PLAYERS = [
  { name: 'carson',   displayName: 'Carson',   isAdmin: true  },
  { name: 'courtney', displayName: 'Courtney', isAdmin: false },
  { name: 'zach',     displayName: 'Zach',     isAdmin: false },
  { name: 'lamar',    displayName: 'Lamar',    isAdmin: false },
  { name: 'kaitlyn',  displayName: 'Kaitlyn',  isAdmin: false },
  { name: 'cameron',  displayName: 'Cameron',  isAdmin: false },
  { name: 'crystal',  displayName: 'Crystal',  isAdmin: false },
  { name: 'chris',    displayName: 'Chris',    isAdmin: false },
];

let STATE = { user:null, auth:null, weekData:null, season:null, seasonStandings:[], allWeeks:[], allCouples:[], eliminatedAll:[], roster:[] };
let _countdownInterval = null;
let _currentView = 'picks';
let _loginBusy = false;
let _selectedPlayer = null;

// Normalize eliminationGuess to array (handles legacy string or new array)
function normalizeElim(eg) {
  if (!eg) return [];
  return Array.isArray(eg) ? eg : [eg];
}

// GAS
async function callGAS(fn, ...args) {
  const resp = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({fn, args, auth: STATE.auth}), redirect:'follow' });
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data.result;
}

// INIT
window.addEventListener('load', () => {
  renderPlayerGrid();
  try {
    const a = localStorage.getItem('dwts_auth');
    const u = localStorage.getItem('dwts_user');
    if (a && u) {
      STATE.auth = JSON.parse(a);
      STATE.user = JSON.parse(u);
      showApp();
      loadAppState().catch(e => {
        if (e.message && e.message.toLowerCase().includes('auth')) logout();
        else toast('Refresh error: ' + e.message, 'error');
      });
    }
  } catch(e) {}
});

// LOGIN
function renderPlayerGrid() {
  document.getElementById('player-grid').innerHTML = PLAYERS.map(p =>
    `<button class="player-btn" onclick="selectPlayer('${p.name}','${p.displayName}')">${p.displayName}</button>`
  ).join('');
}

function selectPlayer(name, displayName) {
  _selectedPlayer = PLAYERS.find(p => p.name === name) || { name, displayName, isAdmin: false };
  document.getElementById('selected-name-label').textContent = displayName;
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').classList.add('hidden');
  document.getElementById('name-section').classList.add('hidden');
  document.getElementById('pin-section').classList.remove('hidden');
  setTimeout(() => document.getElementById('pin-input').focus(), 100);
}

function backToNames() {
  _selectedPlayer = null; _loginBusy = false;
  document.getElementById('pin-section').classList.add('hidden');
  document.getElementById('name-section').classList.remove('hidden');
  document.getElementById('pin-input').value = '';
}

async function attemptLogin() {
  const pin = (document.getElementById('pin-input').value || '').trim();
  if (!_selectedPlayer || pin.length !== 4) { toast('Enter your 4-digit PIN', 'error'); return; }
  if (_loginBusy) return;
  _loginBusy = true;
  showLoading('Loading…');
  STATE.auth = { name: _selectedPlayer.name, pin };
  STATE.user = _selectedPlayer;
  try {
    await loadAppState();
    try {
      localStorage.setItem('dwts_auth', JSON.stringify(STATE.auth));
      localStorage.setItem('dwts_user', JSON.stringify(STATE.user));
    } catch(e) {}
    showApp();
  } catch(e) {
    hideLoading();
    STATE.auth = null; STATE.user = null;
    const msg = (e.message || '').toLowerCase();
    if (msg.includes('auth')) {
      document.getElementById('pin-error').classList.remove('hidden');
    } else {
      toast(e.message, 'error');
    }
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
    _loginBusy = false;
  }
}

function showApp() {
  hideLoading(); _loginBusy = false;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('hdr-name').textContent = STATE.user.displayName;
  document.getElementById('hdr-role').textContent = STATE.user.isAdmin ? 'Commissioner' : 'Player';
  if (STATE.user.isAdmin) document.getElementById('nav-admin').classList.remove('hidden');
  showView('picks');
  startCountdown();
}

function logout() {
  try { localStorage.removeItem('dwts_auth'); localStorage.removeItem('dwts_user'); } catch(e) {}
  location.reload();
}

// APP STATE
async function loadAppState() {
  const data = await callGAS('getAppState');
  STATE.weekData        = data.weekData;
  STATE.season          = data.season;
  STATE.seasonStandings = data.seasonStandings || [];
  STATE.allWeeks        = data.allWeeks || [];
  STATE.allCouples      = data.allCouples || [];
  STATE.eliminatedAll   = data.eliminatedAll || [];
  STATE.roster          = data.roster || [];
  if (_currentView) renderView(_currentView);
}

// NAV
function showView(view) {
  _currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('view-' + view).classList.remove('hidden');
  renderView(view);
}

function renderView(view) {
  if (view === 'picks')     renderPicks();
  if (view === 'standings') renderStandings();
  if (view === 'history')   renderHistory();
  if (view === 'roster')    renderRoster();
  if (view === 'admin')     renderAdmin();
}

// PICKS
function renderPicks() {
  const el = document.getElementById('picks-content');
  const wd = STATE.weekData;
  if (!wd || !wd.week) {
    el.innerHTML = `<div class="card"><div class="muted text-center" style="padding:50px 0;font-size:1.1em;">No week is currently open. Check back soon!</div></div>`;
    document.getElementById('deadline-banner').classList.add('hidden');
    return;
  }
  const week = wd.week, isLocked = wd.isLocked, deadline = wd.deadline ? new Date(wd.deadline) : null, myPick = wd.myPick;
  const activeCouples = STATE.allCouples.filter(c => !STATE.eliminatedAll.includes(c));
  document.getElementById('deadline-banner').classList.remove('hidden');
  document.getElementById('deadline-time-str').textContent = deadline ? fmtDate(deadline) : '—';
  updateCountdown(deadline, isLocked);

  let html = `<div class="card"><div class="card-title">Week ${week.weekNum} Picks</div>`;
  if (week.status === 'closed') {
    html += `<div class="muted">This week is closed. Results are published below.</div>`;
  } else if (isLocked) {
    html += `<div class="warn bold" style="margin-bottom:14px;">Picks are locked — episode has started!</div>`;
  } else {
    const currentElim = myPick ? (Array.isArray(myPick.eliminationGuess) ? myPick.eliminationGuess[0] : myPick.eliminationGuess) : '';
    const lbVal = myPick ? myPick.leaderboardGuess : '';
    html += `<div class="pick-row">
      <label>Who will be eliminated?</label>
      <select class="input" id="elim-select">
        <option value="">— Select couple —</option>
        ${activeCouples.map(c => `<option value="${esc(c)}" ${c===currentElim?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
    </div>
    <div class="pick-row">
      <label>Who will be #1 on the leaderboard?</label>
      <select class="input" id="lb-select">
        <option value="">— Select couple —</option>
        ${activeCouples.map(c => `<option value="${esc(c)}" ${c===lbVal?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-primary btn-full" onclick="submitPicks()" style="margin-top:6px;">
      ${myPick && currentElim ? 'Update Picks' : 'Submit Picks'}
    </button>`;
    if (myPick && currentElim) {
      html += `<div class="small muted" style="margin-top:10px;">Current: <strong>${esc(currentElim)}</strong> eliminated · <strong>${esc(myPick.leaderboardGuess)}</strong> #1</div>`;
    }
  }
  html += `</div>`;

  if (wd.results) {
    const r = wd.results;
    html += `<div class="card"><div class="card-title">Week ${week.weekNum} Results</div>
      <div style="margin-bottom:12px;"><span class="small muted">Eliminated: </span>${(r.eliminated||[]).map(c=>`<span class="roster-pill eliminated">${esc(c)}</span>`).join('')}</div>
      <div style="margin-bottom:10px;"><span class="small muted">Leaderboard #1: </span><span class="lb-1">${esc(r.leaderboard&&r.leaderboard[0]?r.leaderboard[0]:'—')}</span></div>`;
    if (r.leaderboard && r.leaderboard.length > 1) {
      html += `<details><summary class="small muted" style="cursor:pointer;">Full leaderboard (${r.leaderboard.length})</summary>
        <ol style="padding-left:20px; margin-top:8px;">${r.leaderboard.map(c=>`<li class="small" style="padding:3px 0;">${esc(c)}</li>`).join('')}</ol></details>`;
    }
    html += `</div>`;
    if (wd.weeklyStandings && wd.weeklyStandings.length) {
      html += `<div class="card"><div class="card-title">Week ${week.weekNum} Scores</div>
        ${wd.weeklyStandings.map((s,i)=>{ const bd=s.breakdown||{};
          const parts=[]; if(bd.elimGuess>0)parts.push('Elim +'+bd.elimGuess); if(bd.lbGuess>0)parts.push('LB +'+bd.lbGuess); if(bd.survivalBonus>0)parts.push('Surv +'+bd.survivalBonus); if(bd.lbCouple>0)parts.push('LBR +'+bd.lbCouple);
          return `<div class="score-card">
            <div class="score-card-left">
              <span class="rank-badge ${rankClass(i+1)}">${i+1}</span>
              <div><div class="score-card-name">${esc(s.displayName)}</div>${parts.length?`<div class="score-card-breakdown">${parts.join(' · ')}</div>`:''}</div>
            </div>
            <div class="score-card-pts">${s.points} pts</div>
          </div>`; }).join('')}
      </div>`;
    }
  }

  if (!isLocked) {
    html += `<div class="card"><div class="card-title">Pick Status</div><div class="status-grid">
      ${(wd.subStatus||[]).map(s=>`<div class="status-row"><div class="status-name">${esc(s.displayName)}</div>
        <div class="status-badge ${s.submitted?'badge-submitted':'badge-pending'}">${s.submitted?'In':'Pending'}</div></div>`).join('')}
    </div></div>`;
  } else if (wd.visiblePicks && wd.visiblePicks.length && !wd.results) {
    html += `<div class="card"><div class="card-title">Picks Revealed</div>
      <div class="table-scroll"><table class="reveals-table"><thead><tr><th>Player</th><th>Elimination</th><th>LB #1</th></tr></thead><tbody>
      ${wd.visiblePicks.map(p=>{
        const eg = normalizeElim(p.eliminationGuess);
        return `<tr><td class="bold">${esc(p.playerName)}</td><td>${eg.map(esc).join(', ')||'—'}</td><td>${esc(p.leaderboardGuess||'—')}</td></tr>`;
      }).join('')}
      </tbody></table></div></div>`;
  }
  el.innerHTML = html;
}

async function submitPicks() {
  const eg = document.getElementById('elim-select')?.value;
  const lg = document.getElementById('lb-select')?.value;
  if (!eg) { toast('Select an elimination guess', 'error'); return; }
  if (!lg) { toast('Select a leaderboard #1 guess', 'error'); return; }
  showLoading('Submitting picks…');
  try {
    const res = await callGAS('submitPicks', { eliminationGuess: eg, leaderboardGuess: lg });
    await loadAppState(); hideLoading();
    toast(res.allPicksIn ? 'All picks in!' : 'Picks saved!', 'success-toast');
  } catch(e) { hideLoading(); toast(e.message, 'error'); }
}

// COUNTDOWN
function startCountdown() {
  if (_countdownInterval) clearInterval(_countdownInterval);
  _countdownInterval = setInterval(() => {
    const wd = STATE.weekData;
    if (!wd || !wd.deadline) return;
    updateCountdown(new Date(wd.deadline), wd.isLocked);
  }, 1000);
}

function updateCountdown(deadline, isLocked) {
  const el = document.getElementById('deadline-countdown');
  if (!el) return;
  if (isLocked || !deadline) { el.innerHTML = '<span class="deadline-locked">Locked</span>'; return; }
  const diff = deadline - new Date();
  if (diff <= 0) { el.innerHTML = '<span class="deadline-locked">Locked</span>'; return; }
  const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
  el.innerHTML = `<span class="deadline-open">${h>0?h+'h ':''} ${m}m ${h>0?'':s+'s'} left</span>`;
}

// STANDINGS
function renderStandings() {
  const standings = STATE.seasonStandings || [];
  const el = document.getElementById('standings-content');
  if (!standings.length) { el.innerHTML = '<div class="muted small">No scores yet.</div>'; return; }
  const elim = STATE.eliminatedAll || [];

  el.innerHTML = standings.map((s, i) => {
    const bd = s.breakdown || {};
    const rosterScores = s.rosterScores || {};
    const roster = s.roster || [];
    const hasScores = Object.keys(rosterScores).length > 0;
    const rosterTotal = Object.values(rosterScores).reduce((a, b) => a + b, 0);

    const rosterRows = roster.map(c => {
      const score = rosterScores[c];
      const isElim = elim.includes(c);
      return `<div class="brkdwn-row">
        <span class="brkdwn-key${isElim ? ' elim-couple' : ''}">${esc(c)}</span>
        <span class="${isElim ? 'muted' : ''}">${score != null ? score : '—'}</span>
      </div>`;
    }).join('');

    return `<div class="standings-row">
      <div class="standings-row-header" onclick="toggleStandingsRow(this)">
        <span class="rank-badge ${rankClass(i+1)}">${i+1}</span>
        <span class="standings-name">${esc(s.displayName)}</span>
        <span class="standings-pts">${s.totalPoints}</span>
        <span class="standings-arrow">▾</span>
      </div>
      <div class="standings-detail">
        ${roster.length ? `<div class="breakdown-section">
          <div class="breakdown-header">Judges' Scores</div>
          ${rosterRows}
          ${hasScores ? `<div class="brkdwn-row bold" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">
            <span class="brkdwn-key">Roster total</span><span>${rosterTotal}</span>
          </div>` : ''}
        </div>` : ''}
        <div class="breakdown-section">
          <div class="breakdown-header">Bonus Points</div>
          <div class="brkdwn-row"><span class="brkdwn-key">Elimination Guess</span><span class="${(bd.elimGuess||0)>0?'success':'muted'}">${(bd.elimGuess||0)>0?'+'+bd.elimGuess:'—'}</span></div>
          <div class="brkdwn-row"><span class="brkdwn-key">Survived Elimination</span><span class="${(bd.survivalBonus||0)>0?'success':'muted'}">${(bd.survivalBonus||0)>0?'+'+bd.survivalBonus:'—'}</span></div>
          <div class="brkdwn-row"><span class="brkdwn-key">Leaderboard Bonus</span><span class="${(bd.lbCouple||0)>0?'success':'muted'}">${(bd.lbCouple||0)>0?'+'+bd.lbCouple:'—'}</span></div>
          <div class="brkdwn-row"><span class="brkdwn-key">Leaderboard Guess</span><span class="${(bd.lbGuess||0)>0?'success':'muted'}">${(bd.lbGuess||0)>0?'+'+bd.lbGuess:'—'}</span></div>
          <div class="brkdwn-row bold" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">
            <span>Total</span><span class="accent">${s.totalPoints}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleStandingsRow(header) {
  const detail = header.nextElementSibling;
  const arrow  = header.querySelector('.standings-arrow');
  if (!detail) return;
  const open = detail.classList.toggle('open');
  if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : '';
}

// HISTORY
async function renderHistory() {
  const el = document.getElementById('history-content');
  const closed = STATE.allWeeks.filter(w => w.status === 'closed');
  if (!closed.length) { el.innerHTML = '<div class="muted small">No completed weeks yet.</div>'; return; }
  el.innerHTML = '<div class="muted small">Loading…</div>';
  try {
    const histories = await Promise.all(closed.map(w => callGAS('getWeekHistory', w.weekId)));
    const name = STATE.user.name.toLowerCase();
    let html = '';
    for (const h of histories.reverse()) {
      if (!h || !h.week) continue;
      const myPick  = (h.picks||[]).find(p => p.playerName.toLowerCase() === name);
      const myScore = (h.standings||[]).find(s => s.name.toLowerCase() === name);
      const pts = myScore ? myScore.points : 0;
      const bd  = myScore ? myScore.breakdown || {} : {};
      const r   = h.results;
      const myElims = myPick ? normalizeElim(myPick.eliminationGuess) : [];
      html += `<div class="week-history-row" onclick="toggleWeekDetail(this)">
        <div class="wh-top">
          <div><div class="bold" style="font-size:1.05em;">Week ${h.week.weekNum}</div><div class="small muted" style="margin-top:2px;">${fmtDate(new Date(h.week.deadline))}</div></div>
          <div class="wh-pts">${pts} pts</div>
        </div>
        <div class="week-history-detail">
          ${myPick ? `
            <div class="brkdwn-row"><span class="brkdwn-key">Elimination guess</span><span>${myElims.map(esc).join(', ')||'—'} ${r&&r.eliminated&&myElims.some(g=>r.eliminated.includes(g))?'<span class="correct">✓</span>':'<span class="incorrect">✗</span>'}</span></div>
            <div class="brkdwn-row"><span class="brkdwn-key">LB #1 guess</span><span>${esc(myPick.leaderboardGuess||'—')} ${r&&r.leaderboard&&r.leaderboard[0]===myPick.leaderboardGuess?'<span class="correct">✓</span>':'<span class="incorrect">✗</span>'}</span></div>
          ` : '<div class="muted small">No pick submitted</div>'}
          <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
            ${bd.elimGuess>0?`<div class="brkdwn-row"><span class="brkdwn-key">Elimination bonus</span><span class="brkdwn-val pos">+${bd.elimGuess}</span></div>`:''}
            ${bd.lbGuess>0?`<div class="brkdwn-row"><span class="brkdwn-key">Leaderboard bonus</span><span class="brkdwn-val pos">+${bd.lbGuess}</span></div>`:''}
            ${bd.survivalBonus>0?`<div class="brkdwn-row"><span class="brkdwn-key">Survival (${(bd.survivingCouples||[]).length})</span><span class="brkdwn-val pos">+${bd.survivalBonus}</span></div>`:''}
            ${bd.lbCouple>0?`<div class="brkdwn-row"><span class="brkdwn-key">LB roster couple</span><span class="brkdwn-val pos">+${bd.lbCouple}</span></div>`:''}
            <div class="brkdwn-row bold" style="margin-top:6px;"><span>Total</span><span class="accent">${pts} pts</span></div>
          </div>
          ${r?`<div style="margin-top:12px;" class="small muted"><div>Eliminated: ${(r.eliminated||[]).join(', ')||'—'}</div><div>LB #1: ${r.leaderboard&&r.leaderboard[0]?r.leaderboard[0]:'—'}</div></div>`:''}
        </div>
      </div>`;
    }
    el.innerHTML = html || '<div class="muted small">No history yet.</div>';
  } catch(e) { el.innerHTML = `<div class="danger small">${esc(e.message)}</div>`; }
}

function toggleWeekDetail(row) {
  row.querySelector('.week-history-detail').classList.toggle('open');
}

// ROSTER
function renderRoster() {
  const roster = STATE.roster || [], elim = STATE.eliminatedAll || [];
  document.getElementById('roster-content').innerHTML = !roster.length
    ? '<div class="muted small">No roster found.</div>'
    : `<div style="margin-bottom:8px;">${roster.map(c=>`<span class="roster-pill ${elim.includes(c)?'eliminated':''}">${esc(c)}</span>`).join('')}</div>
       <div class="small muted">${roster.filter(c=>!elim.includes(c)).length} of ${roster.length} couples still competing.</div>`;

  document.getElementById('all-rosters-content').innerHTML =
    (STATE.seasonStandings||[]).map(s=>`
      <div style="margin-bottom:16px;">
        <div class="bold" style="margin-bottom:6px;">${esc(s.displayName)}</div>
        ${(s.roster||[]).map(c=>`<span class="roster-pill ${elim.includes(c)?'eliminated':''}">${esc(c)}</span>`).join('')}
      </div>`).join('') || '<div class="muted small">No roster data.</div>';
}

// ADMIN
async function renderAdmin() {
  if (!STATE.user || !STATE.user.isAdmin) return;
  const el = document.getElementById('admin-content');
  el.innerHTML = '<div class="muted small">Loading…</div>';
  try {
    renderAdminDash(await callGAS('adminGetDashboard'));
  } catch(e) { el.innerHTML = `<div class="danger">${esc(e.message)}</div>`; }
}

function renderAdminDash(dash) {
  const el   = document.getElementById('admin-content');
  const week = dash.week;
  const elim = dash.eliminatedAll || [];
  const activeCouples = STATE.allCouples.filter(c => !elim.includes(c));

  let html = '<div class="card"><div class="card-title">Week Management</div>';

  if (!week) {
    html += `<div class="admin-section"><h3>Open New Week</h3>
      <div class="form-row"><label>Week Number</label><input type="number" class="input" id="a-weeknum" min="1" max="11" placeholder="e.g. 1"></div>
      <div class="form-row"><label>Notes (optional)</label><input type="text" class="input" id="a-notes" placeholder="e.g. Week 1 — Premiere"></div>
      <button class="btn btn-primary btn-full" onclick="adminOpenWeek()">Open Week</button>
    </div>`;
  } else {
    const isLocked = dash.isLocked;
    html += `<div style="margin-bottom:14px;">
      <div class="bold" style="font-size:1.05em;">Week ${week.weekNum} · <span class="accent">${week.status}</span>${isLocked?' <span class="danger">LOCKED</span>':' <span class="success">OPEN</span>'}</div>
      <div class="small muted" style="margin-top:4px;">${fmtDate(new Date(week.deadline))}</div>
      <div class="small muted" style="margin-top:4px;">Missing: ${dash.missing&&dash.missing.length?dash.missing.join(', '):'All submitted'}</div>
    </div>`;

    // Player pick overrides
    html += `<div class="admin-section"><h3>Override Player Picks</h3>`;
    for (const s of (dash.subStatus || [])) {
      const hp = s.pick && s.pick.eliminationGuess;
      const eArr = hp ? normalizeElim(s.pick.eliminationGuess) : [];
      const eShort = eArr.length ? eArr.map(c => c.split('&')[0].trim()).join(', ') : '—';
      const lShort = hp ? s.pick.leaderboardGuess.split('&')[0].trim() : '—';
      html += `<div class="pick-accordion" id="acc-${esc(s.name)}">
        <div class="pick-acc-header" onclick="toggleAcc('${esc(s.name)}')">
          <div><span class="bold">${esc(s.displayName)}</span><span style="margin-left:8px;">${s.submitted?'✓':''}</span></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="pick-status-txt">${esc(eShort)} · ${esc(lShort)}</span>
            <span class="acc-arrow">▾</span>
          </div>
        </div>
        <div class="pick-acc-body" id="acc-body-${esc(s.name)}">
          <div class="form-row"><label>Elimination guess</label>
            <select class="input" id="ov-elim-${esc(s.name)}">
              <option value="">— Select —</option>
              ${STATE.allCouples.map(c=>{ const isE=elim.includes(c), sel=hp&&eArr.includes(c)?'selected':''; return `<option value="${esc(c)}" ${sel} ${isE?'disabled':''}>${esc(c)}${isE?' ✗':''}</option>`; }).join('')}
            </select></div>
          <div class="form-row"><label>Leaderboard #1 guess</label>
            <select class="input" id="ov-lb-${esc(s.name)}">
              <option value="">— Select —</option>
              ${STATE.allCouples.map(c=>{ const isE=elim.includes(c), sel=hp&&s.pick.leaderboardGuess===c?'selected':''; return `<option value="${esc(c)}" ${sel} ${isE?'disabled':''}>${esc(c)}${isE?' ✗':''}</option>`; }).join('')}
            </select></div>
          <button class="btn btn-sm btn-primary btn-full" onclick="adminSetPick('${esc(s.name)}', '${week.weekId}')">Save Override</button>
        </div>
      </div>`;
    }
    html += `</div>`;

    // Results entry
    if (!dash.results || !dash.results.publishedAt) {
      html += `<div class="admin-section"><h3>Enter Episode Results</h3>
      <label style="margin-bottom:10px;display:block;">Who was eliminated? (tap to select)</label>
      <div class="chip-grid" id="elim-chips">
        ${activeCouples.map(c => {
          const pre = dash.results && (dash.results.eliminated||[]).includes(c);
          return `<div class="chip${pre?' elim-on':''}" data-couple="${esc(c)}" onclick="this.classList.toggle('elim-on')">${esc(c)}</div>`;
        }).join('')}
      </div>
      <label style="margin-bottom:8px;display:block;margin-top:6px;">Couple scores — determines leaderboard ranking</label>
      <div class="score-grid">
        ${activeCouples.map(c => {
          const pre = dash.results && dash.results.coupleScores && dash.results.coupleScores[c] != null ? dash.results.coupleScores[c] : '';
          return `<div class="score-row">
            <div class="score-name">${esc(c)}</div>
            <input type="number" class="input score-inp" data-couple="${esc(c)}" placeholder="—" step="0.5" min="0" max="40" value="${pre}">
          </div>`;
        }).join('')}
      </div>
      <div class="inline-btns" style="margin-top:18px;">
        <button class="btn btn-primary" onclick="adminSaveResults('${week.weekId}')">Save</button>
        <button class="btn btn-success" onclick="adminGrade('${week.weekId}')">Grade</button>
        <button class="btn btn-accent3" onclick="adminPublish('${week.weekId}')">Publish</button>
      </div></div>`;
    } else {
      html += `<div class="admin-section">
        <div class="small success" style="margin-bottom:14px;">Results published</div>
        <div class="inline-btns">
          <button class="btn btn-success btn-sm" onclick="adminGrade('${week.weekId}')">Re-grade</button>
          <button class="btn btn-accent3 btn-sm" onclick="adminPublish('${week.weekId}')">Re-publish</button>
        </div>
      </div>`;
    }

    // Graded scores
    if (dash.weeklyStandings && dash.weeklyStandings.length) {
      html += `<div class="admin-section"><h3>Graded Scores</h3>
        ${dash.weeklyStandings.map((s,i)=>{ const bd=s.breakdown||{};
          const parts=[]; if(bd.elimGuess>0)parts.push('Elim +'+bd.elimGuess); if(bd.lbGuess>0)parts.push('LB +'+bd.lbGuess); if(bd.survivalBonus>0)parts.push('Surv +'+bd.survivalBonus); if(bd.lbCouple>0)parts.push('LBR +'+bd.lbCouple);
          return `<div class="score-card">
            <div class="score-card-left">
              <span class="rank-badge ${rankClass(i+1)}">${i+1}</span>
              <div><div class="score-card-name">${esc(s.displayName)}</div><div class="score-card-breakdown">${parts.length?parts.join(' · '):'No bonus'}</div></div>
            </div>
            <div class="score-card-pts">${s.points} pts</div>
          </div>`; }).join('')}
      </div>`;
    }

    // Open next week
    if (week.status === 'closed') {
      html += `<div class="admin-section"><h3>Open Next Week</h3>
        <div class="form-row"><label>Week Number</label><input type="number" class="input" id="a-weeknum" min="1" max="11" value="${week.weekNum+1}"></div>
        <div class="form-row"><label>Notes</label><input type="text" class="input" id="a-notes" placeholder="optional"></div>
        <button class="btn btn-primary btn-full" onclick="adminOpenWeek()">Open Week ${week.weekNum+1}</button>
      </div>`;
    }
  }

  html += '</div>';
  el.innerHTML = html;
}

function toggleAcc(name) {
  const body   = document.getElementById('acc-body-' + name);
  const header = document.querySelector('#acc-' + name + ' .pick-acc-header');
  if (!body) return;
  const open = body.classList.toggle('open');
  if (header) header.classList.toggle('open', open);
}

// Admin actions
async function adminOpenWeek() {
  const num = parseInt(document.getElementById('a-weeknum')?.value);
  const notes = document.getElementById('a-notes')?.value || '';
  if (!num || num < 1 || num > 11) { toast('Enter a valid week number (1–11)', 'error'); return; }
  showLoading('Opening week…');
  try {
    await callGAS('adminOpenWeek', num, notes);
    toast(`Week ${num} opened!`, 'success-toast');
    await loadAppState(); await renderAdmin(); hideLoading();
  } catch(e) { hideLoading(); toast(e.message, 'error'); }
}

async function adminSaveResults(weekId) {
  const eliminated = [...document.querySelectorAll('#elim-chips .chip.elim-on')].map(el => el.dataset.couple);
  const coupleScores = {};
  document.querySelectorAll('.score-inp').forEach(inp => {
    const val = parseFloat(inp.value);
    if (!isNaN(val) && inp.dataset.couple) coupleScores[inp.dataset.couple] = val;
  });
  // Derive leaderboard order from scores (highest first), unscored couples appended alphabetically
  const scored = Object.entries(coupleScores).sort((a, b) => b[1] - a[1]).map(([c]) => c);
  const scoredSet = new Set(scored);
  const unscored = STATE.allCouples.filter(c => !scoredSet.has(c) && !eliminated.includes(c));
  const leaderboard = [...scored, ...unscored];

  if (!eliminated.length) { toast('Select at least one eliminated couple', 'error'); return; }
  if (!scored.length) { toast('Enter at least one couple score', 'error'); return; }
  showLoading('Saving results…');
  try {
    await callGAS('adminEnterResults', weekId, { eliminated, leaderboard, coupleScores });
    toast('Results saved!', 'success-toast'); hideLoading();
  } catch(e) { hideLoading(); toast(e.message, 'error'); }
}

async function adminGrade(weekId) {
  showLoading('Grading week…');
  try {
    await callGAS('adminGradeWeek', weekId);
    toast('Week graded!', 'success-toast'); await renderAdmin(); hideLoading();
  } catch(e) { hideLoading(); toast(e.message, 'error'); }
}

async function adminPublish(weekId) {
  if (!confirm('Publish results? This closes the week and makes scores visible to all players.')) return;
  showLoading('Publishing…');
  try {
    await callGAS('adminPublishResults', weekId);
    toast('Results published!', 'success-toast');
    await loadAppState(); await renderAdmin(); hideLoading();
  } catch(e) { hideLoading(); toast(e.message, 'error'); }
}

async function adminSetPick(playerName, weekId) {
  const elim = document.getElementById(`ov-elim-${playerName}`)?.value;
  const lb   = document.getElementById(`ov-lb-${playerName}`)?.value;
  if (!elim || !lb) { toast('Select both guesses for ' + playerName, 'error'); return; }
  showLoading('Saving override…');
  try {
    await callGAS('adminSetPick', weekId, playerName, elim, lb);
    toast('Pick saved for ' + playerName, 'success-toast');
    await renderAdmin(); hideLoading();
  } catch(e) { hideLoading(); toast(e.message, 'error'); }
}

// Utilities
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '—';
  try { return d.toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}); }
  catch(e) { return d.toString(); }
}
function rankClass(r) { return r===1?'rank-1':r===2?'rank-2':r===3?'rank-3':'rank-n'; }
function showLoading(msg) { document.getElementById('loading-overlay').classList.remove('hidden'); document.getElementById('loading-msg').textContent = msg||'Loading…'; }
function hideLoading()    { document.getElementById('loading-overlay').classList.add('hidden'); }
let _toastT = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type==='error'?' error':type==='success-toast'?' success-toast':'');
  if (_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(() => el.className='', 3200);
}
</script>
